en:
  theme_metadata:
    description: "Lets a trusted group rate your answer bot's replies — good, needs work, or pull it out of public view — using Discourse's own likes, staff-only whispers and post deletion. It never flags anything, so the bot account is never penalised."
    settings:
      bot_usernames: "Usernames of the bot account(s) whose replies can be rated. Replies from anyone else are never touched. Leave empty and nothing appears anywhere."
      evaluator_groups: "Names of the groups whose members see the rating bar, e.g. eyantra_staff. Leave empty and nothing appears anywhere."
      hide_on_review: "Mark for review deletes the reply, which takes it out of public view while leaving it visible to moderators. Un-marking restores it. Switch off to record the note without removing anything."
      mark_solution_on_good: "A thumbs up also accepts the reply as the topic's solution, and taking it back withdraws it. Needs the Solved plugin; ignored without it."

  bot_eval:
    title: "Bot reply:"
    up: "Good"
    down: "Needs work"
    mark_review: "Mark for review"
    unmark_review: "Put back"
    save: "Save"
    cancel: "Cancel"
    remove: "Undo"
    hint:
      up: "What made this reply good? Optional — a line about what it got right helps us keep it that way. It is recorded as a staff-only whisper."
      down: "Optional, but please do write: what is wrong — a wrong fact, a missing step, a bad link, the wrong tone. It is recorded as a staff-only whisper that members never see."
      review: "Optional, but please do write: why this reply should not be public. Saving removes the reply from the topic for everyone except moderators. You can put it back at any time."
    hint_solution:
      up: "It is also marked as the topic's solution."
      down: "It also stops being the topic's solution."
      review: "It also stops being the topic's solution."
    placeholder:
      up: "e.g. correct steps, linked the right rulebook section"
      down: "e.g. it quoted last year's deadline"
      review: "e.g. contains a wrong submission deadline"
    no_note:
      up: "No note given."
      down: "No reason given."
      review: "No reason given."
    status:
      liked: "You marked this reply as good."
      flagged: "You marked this reply as needing work."
      hidden: "Removed from the topic. Only moderators can see it."
      solution: "Accepted as the topic's solution."
    notice:
      whisper_failed: "The reply was rated, but the note could not be saved as a whisper."
      solution_failed: "Your rating was saved, but the topic's solution could not be changed. The Solved plugin may not accept this call on this Discourse version."
      solution_not_here: "Your rating was saved. Solutions are not switched on for this category, so the reply was not marked as the solution."
      hide_failed: "Your note was recorded, but the reply could not be removed. You may not have moderator rights here."
      undo_failed: "That could not be undone. You can delete the whisper from the topic instead."
